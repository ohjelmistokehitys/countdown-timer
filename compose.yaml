services:

  timer-dev:
    build:
      context: .
      target: dev

    ports:
      - 5173:5173

    volumes:
      - ./:/app/
      - timer_demo_node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_APP_TITLE=Development timer

  backend:
    build:
      context: ./backend/

    env_file: backend.env

    ports:
      - 5050:5050

  production:
    build:
      context: .
      target: runner
      args:
        - TITLE=Production timer

    ports:
      - 8080:80

volumes:
  timer_demo_node_modules: {}
