name: Build the project

on:
  push:
    branches: ['trunk']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm install

      - name: Run eslint
        run: npm run lint

      - name: Build
        run: npm run build
